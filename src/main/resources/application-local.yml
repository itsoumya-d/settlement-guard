# Local demo environment: H2 in MySQL mode, Kafka disabled.
spring:
  datasource:
    url: jdbc:h2:mem:settlement;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    listener:
      auto-startup: false
app:
  kafka:
    enabled: false
